@if (!isAdminRoute()) {
  <a href="#main-content" class="skip-link">{{ t('skipToContent') }}</a>
  <app-flash-sale-banner />
  <app-customer-header />
  <app-customer-drawer />
}

<div [class]="isAdminRoute() ? 'min-h-screen bg-ink-50' : 'app-storefront flex min-h-screen flex-col'">
  <main
    id="main-content"
    [class]="isAdminRoute() ? 'min-h-screen' : 'storefront-main flex-1 pb-24 lg:pb-10'"
    tabindex="-1"
  >
    <div [class]="isAdminRoute() ? '' : 'container py-4 sm:py-6'">
      <router-outlet />
    </div>
  </main>

  @if (!isAdminRoute()) {
    <app-customer-footer />
    <app-customer-bottom-nav />
    <app-contact-floating />
  }
</div>

<ui-feedback-host />
