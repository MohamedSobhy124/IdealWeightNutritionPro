<ui-page-header [title]="t('returnsTitle')" [subtitle]="items().length + ' ' + t('returnsTitle')" />

@if (error()) {
  <ui-alert class="mb-4" variant="danger" [message]="error()" [retryable]="true" (retry)="load()" />
}

<ui-data-table
  rowLinkBase="/admin/returns"
  storageKey="admin-returns"
  [columns]="cols"
  [rows]="$any(items())"
  [loading]="loading()"
  [searchable]="true"
  [exportable]="true"
  [pageSize]="20"
  [tabs]="tabs()"
  [activeTab]="status()"
  (tabChange)="onTab($event)"
  [searchPlaceholder]="t('search')"
  emptyIcon="assignment_return"
  [emptyTitle]="t('noReturns')"
  [ofLabel]="t('of')"
  [previousPageLabel]="t('prevPage')"
  [nextPageLabel]="t('nextPage')"
>
  <ng-template uiCell="id" let-row>
    <a [routerLink]="['/admin/returns', $any(row).id]" class="font-semibold text-ink-900 no-underline hover:text-brand-700">#{{ $any(row).id }}</a>
  </ng-template>

  <ng-template uiCell="orderId" let-row>
    <a [routerLink]="['/admin/orders', $any(row).orderId]" class="text-ink-700 no-underline hover:text-brand-700">#{{ $any(row).orderId }}</a>
  </ng-template>

  <ng-template uiCell="status" let-row>
    <ui-badge [variant]="statusVariant($any(row).status)" [dot]="true">{{ statusText($any(row).status) }}</ui-badge>
  </ng-template>

  <ng-template uiCell="customerEmail" let-row>
    <span class="text-ink-700">{{ $any(row).customerEmail ?? '—' }}</span>
  </ng-template>

  <ng-template uiCell="refundAmount" let-row>
    @let r = $any(row);
    @if (r.refundAmount != null) {
      <span class="whitespace-nowrap font-semibold text-ink-900">{{ r.refundAmount | iwnCurrency }}</span>
    } @else {
      <span class="text-ink-400">—</span>
    }
  </ng-template>

  <ng-template uiCell="requestDate" let-row>
    <bdi class="whitespace-nowrap text-ink-600">{{ $any(row).requestDate | date: 'd MMM y' }}</bdi>
  </ng-template>
</ui-data-table>
