<ui-page-header [title]="t('newsletterTitle')" [subtitle]="items().length + ' ' + t('newsletterTitle')">
  <div header-actions>
    <button type="button" class="ui-btn-primary ui-btn-sm" (click)="exportCsv()" [disabled]="exporting()">
      <span class="material-icons !text-[18px]" aria-hidden="true">download</span>
      {{ exporting() ? t('exporting') : t('exportSubscribers') }}
    </button>
  </div>
</ui-page-header>

@if (error()) {
  <ui-alert class="mb-4" variant="danger" [message]="error()" [retryable]="true" (retry)="load()" />
}

<ui-data-table
  [columns]="cols"
  [rows]="$any(items())"
  [loading]="loading()"
  [searchable]="true"
  [pageSize]="20"
  [tabs]="tabs()"
  [activeTab]="status()"
  (tabChange)="onTab($event)"
  storageKey="admin-newsletter"
  emptyIcon="mail"
  [emptyTitle]="t('noSubscribers')"
  [ofLabel]="t('of')"
  [previousPageLabel]="t('prevPage')"
  [nextPageLabel]="t('nextPage')"
>
  <ng-template uiCell="email" let-row>
    <span class="font-medium text-ink-900" dir="ltr">{{ $any(row).email }}</span>
  </ng-template>

  <ng-template uiCell="subscribedDate" let-row>
    <bdi class="whitespace-nowrap text-ink-600">{{ $any(row).subscribedDate | date: 'd MMM y' }}</bdi>
  </ng-template>

  <ng-template uiCell="source" let-row>
    <span class="text-ink-600">{{ $any(row).source ?? '—' }}</span>
  </ng-template>

  <ng-template uiCell="status" let-row>
    @let item = $any(row);
    <ui-badge [variant]="item.isActive ? 'success' : 'neutral'" [dot]="item.isActive">
      {{ item.isActive ? t('active') : t('inactive') }}
    </ui-badge>
  </ng-template>

  <ng-template uiCell="actions" let-row>
    @let item = $any(row);
    <ui-action-menu [label]="t('moreActions')" [items]="rowMenu(item)" [disabled]="busyId() === item.id" (select)="onRowAction($event, item)" />
  </ng-template>
</ui-data-table>
