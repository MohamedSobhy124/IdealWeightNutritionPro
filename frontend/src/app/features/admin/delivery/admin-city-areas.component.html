<ui-page-header
  [title]="t('remoteAreasTitle')"
  [subtitle]="city() ? locale.pick(city()!.name, city()!.nameAr ?? city()!.name) : ''"
  backLink="/admin/cities"
  [backLabel]="t('citiesTitle')"
>
  <div header-actions>

    <button type="button" class="ui-btn-primary ui-btn-sm" (click)="openCreate()">{{ t('newRemoteArea') }}</button>

  </div>

</ui-page-header>



@if (message() && !showForm()) {
  <ui-alert class="mb-4 block" variant="danger" [message]="message()" [dismissible]="true" (dismiss)="message.set(null)" />
}

<ui-modal
  [open]="showForm()"
  variant="drawer"
  size="lg"
  [heading]="editingId() ? t('editRemoteArea') : t('newRemoteArea')"
  [closeLabel]="t('shellClose')"
  (closed)="cancelForm()"
>
  <form id="area-form" (ngSubmit)="submit()">
    @if (message()) {
      <ui-alert class="mb-4 block" variant="danger" [message]="message()" [dismissible]="true" (dismiss)="message.set(null)" />
    }
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <ui-form-field [label]="t('titleEn')" [required]="true">
        <input class="ui-input" [(ngModel)]="name" name="name" required />
      </ui-form-field>
      <ui-form-field [label]="t('titleAr')">
        <input class="ui-input" [(ngModel)]="nameAr" name="nameAr" />
      </ui-form-field>
      <ui-form-field [label]="t('deliveryCharge')">
        <input type="number" min="0" step="0.01" class="ui-input" [(ngModel)]="deliveryCharge" name="deliveryCharge" />
      </ui-form-field>
      <ui-form-field [label]="t('displayOrder')">
        <input type="number" min="0" class="ui-input" [(ngModel)]="displayOrder" name="displayOrder" />
      </ui-form-field>
    </div>
    <label class="mt-4 flex items-center gap-2 text-sm text-ink-700">
      <input type="checkbox" class="accent-brand-600" [(ngModel)]="isActive" name="isActive" />
      {{ t('active') }}
    </label>
  </form>
  <div modal-footer class="flex shrink-0 gap-2 border-t border-ink-200 px-5 py-4">
    <button type="submit" form="area-form" class="ui-btn-primary ui-btn-sm" [disabled]="busyId() !== null">{{ t('save') }}</button>
    <button type="button" class="ui-btn-secondary ui-btn-sm" (click)="cancelForm()">{{ t('cancel') }}</button>
  </div>
</ui-modal>



@if (error()) {

  <ui-alert class="mb-4 block" variant="danger" [message]="error()" [retryable]="true" (retry)="load()" />

}



<ui-data-table

  [columns]="cols"

  [rows]="$any(items())"

  [loading]="loading()"

  [clickableRows]="true"
  (rowClick)="openEdit($any($event))"
  [exportable]="true"
  exportFileName="remote-areas.csv"
  storageKey="admin-remote-areas"
  [pageSize]="20"

  [emptyTitle]="t('noRemoteAreas')"

  [ofLabel]="t('of')"
  [previousPageLabel]="t('prevPage')"
  [nextPageLabel]="t('nextPage')"
  >



  <ng-template uiCell="title" let-row>

    @let item = $any(row);

    <span class="font-medium">{{ areaName(item) }}</span>

    <span class="block text-xs text-ink-400">#{{ item.id }}</span>

  </ng-template>



  <ng-template uiCell="deliveryCharge" let-row>

    <span class="font-semibold text-ink-900">{{ $any(row).deliveryCharge | iwnCurrency }}</span>

  </ng-template>



  <ng-template uiCell="status" let-row>

    @let item = $any(row);

    <ui-badge [variant]="item.isActive ? 'success' : 'neutral'" [dot]="item.isActive">

      {{ item.isActive ? t('active') : t('inactive') }}

    </ui-badge>

  </ng-template>



  <ng-template uiCell="actions" let-row>
    @let item = $any(row);
    <ui-action-menu
      [label]="t('moreActions')"
      [disabled]="busyId() === item.id"
      [items]="[
        { id: 'edit', label: t('edit'), icon: 'edit' },
        { id: 'delete', label: t('remove'), icon: 'delete_outline', danger: true, dividerBefore: true }
      ]"
      (select)="$event === 'edit' ? openEdit(item) : $event === 'delete' ? remove(item) : null"
    />
  </ng-template>

</ui-data-table>
